name: Build Windows EXE

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=mod
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  GOTOOLCHAIN: auto
  WAILS3_VERSION: v3.0.0-beta.16

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        shell: pwsh
        run: npm install --global pnpm@11.0.8

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $goBin = Join-Path $env:USERPROFILE "go\bin"
          $env:Path = "$goBin;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $goBin
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS3_VERSION"
          wails3 version

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate Wails bindings
        shell: pwsh
        run: wails3 generate bindings -f "-tags production,devtools" -clean=true -ts

      - name: Build frontend
        working-directory: frontend
        env:
          PRODUCTION: "true"
        run: pnpm run build

      - name: Test Epic account switching
        shell: pwsh
        run: go test -count=1 ./internal/basic ./internal/winutil

      - name: Build EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null

          Push-Location build
          wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico
          wails3 generate syso -arch amd64 -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ..\wails_windows_amd64.syso
          Pop-Location

          try {
            go build -tags production,devtools -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o bin\TcNo-Acc-Switcher.exe
          }
          finally {
            Remove-Item -Force -ErrorAction SilentlyContinue wails_windows_amd64.syso
          }

          if (-not (Test-Path bin\TcNo-Acc-Switcher.exe)) {
            throw "Build finished without producing bin\TcNo-Acc-Switcher.exe"
          }

          $hash = (Get-FileHash bin\TcNo-Acc-Switcher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TcNo-Acc-Switcher.exe" | Set-Content -Encoding ascii bin\TcNo-Acc-Switcher.exe.sha256
          Write-Host "Built bin\TcNo-Acc-Switcher.exe"
          Write-Host "SHA256: $hash"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: TcNo-Acc-Switcher-windows-amd64
          path: |
            bin/TcNo-Acc-Switcher.exe
            bin/TcNo-Acc-Switcher.exe.sha256
          if-no-files-found: error
          retention-days: 14
